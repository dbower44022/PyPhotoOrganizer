[pytest]
# Pytest configuration for PyPhotoOrganizer

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --maxfail=5
    --color=yes

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for complete workflows
    database: Database operation and schema tests
    slow: Tests that take significant time to run
    requires_ffmpeg: Tests that require FFmpeg to be installed

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=. --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (if using pytest-timeout)
# timeout = 300
# timeout_method = thread
